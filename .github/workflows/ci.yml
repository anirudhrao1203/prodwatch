name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Inventory Service syntax
        run: python -m py_complie inventory-service/main.py

      - name: Check Order Service syntax
        run: python -m py_complie order-service/main.py

      - name: Build Inventory Service image
        run: docker build -t inventory-service:ci ./inventory-service

      - name: Build Order Service image
        run: docker build -t order-service:ci ./order-service
